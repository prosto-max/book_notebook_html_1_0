<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Писательская Студия v4</title>
    <style>
        :root {
            --bg: #181825;
            --panel: #1e1e2e;
            --surface: #313244;
            --surface-hover: #45475a;
            --text: #cdd6f4;
            --subtext: #a6adc8;
            --accent: #89b4fa;
            --link-bg: rgba(249, 226, 175, 0.18);
            --link-text: #f9e2af;
            --danger: #f38ba8;
            --success: #a6e3a1;
            --border: #313244;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        header {
            background: var(--panel);
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            z-index: 10;
        }
        .header-left { display: flex; align-items: center; gap: 8px; overflow: hidden; flex: 1; }
        .icon-btn {
            background: var(--surface);
            color: var(--text);
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .icon-btn:active { background: var(--accent); color: #11111b; }
        .current-path { display: flex; flex-direction: column; overflow: hidden; cursor: pointer; }
        .current-folder-label { font-size: 11px; color: var(--subtext); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .current-tab-label { font-size: 15px; font-weight: bold; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Панель инструментов: основные кнопки слева, кнопки JSON — правее всех */
        .toolbar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 8px 12px;
            background: #11111b;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            align-items: center;
        }
        .toolbar-spacer {
            margin-left: auto;
        }
        .toolbar button, .toolbar .file-btn {
            background: var(--surface);
            color: var(--text);
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            white-space: nowrap;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        .toolbar button.btn-green { background: rgba(166, 227, 161, 0.18); color: var(--success); border: 1px solid var(--success); }
        .toolbar button.btn-blue { background: rgba(137, 180, 250, 0.18); color: var(--accent); border: 1px solid var(--accent); }
        .toolbar button:active, .toolbar .file-btn:active { background: var(--accent); color: #11111b; }
        input[type="file"] { display: none; }

        #editor {
            flex: 1;
            padding: 18px 16px 60px 16px;
            overflow-y: auto;
            font-size: 17px;
            line-height: 1.65;
            outline: none;
            word-wrap: break-word;
        }
        #editor img { max-width: 100%; border-radius: 8px; margin: 12px 0; display: block; border: 1px solid var(--surface-hover); }
        .wiki-link {
            color: var(--link-text);
            background: var(--link-bg);
            border-bottom: 1px dashed var(--link-text);
            font-weight: 600;
            padding: 1px 6px;
            border-radius: 4px;
            cursor: pointer;
            display: inline-block;
            margin: 0 1px;
        }

        /* Боковая панель папок */
        .drawer-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65); z-index: 99; display: none; }
        .drawer-overlay.open { display: block; }
        .drawer {
            position: fixed; top: 0; left: 0; bottom: 0; width: 86%; max-width: 360px;
            background: var(--panel); z-index: 100; transform: translateX(-100%);
            transition: transform 0.22s ease; display: flex; flex-direction: column; border-right: 1px solid var(--border);
        }
        .drawer.open { transform: translateX(0); }
        .drawer-header { padding: 12px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; background: #14141f; }
        .drawer-top-row { display: flex; justify-content: space-between; align-items: center; }
        .drawer-title { font-weight: bold; font-size: 16px; color: var(--accent); }
        .search-input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--surface-hover); background: var(--bg); color: var(--text); font-size: 14px; outline: none; }
        .drawer-actions { display: flex; gap: 6px; }
        .drawer-actions button { flex: 1; padding: 8px; font-size: 13px; border-radius: 6px; border: none; background: var(--surface); color: var(--text); font-weight: 600; cursor: pointer; }
        .drawer-actions button.primary { background: var(--accent); color: #11111b; }

        .tree-container { flex: 1; overflow-y: auto; padding: 8px; }
        .folder-block { margin-bottom: 6px; border-radius: 8px; overflow: hidden; border: 1px solid #28283d; background: #1a1a29; }
        .folder-header { padding: 10px 12px; background: #232336; display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; font-weight: 600; font-size: 14px; }
        .folder-header-left { display: flex; align-items: center; gap: 8px; overflow: hidden; }
        .folder-count { font-size: 11px; background: var(--surface); color: var(--subtext); padding: 2px 6px; border-radius: 10px; }
        .folder-items { display: none; flex-direction: column; padding: 4px; }
        .folder-block.expanded .folder-items { display: flex; }
        .note-item { display: flex; align-items: center; justify-content: space-between; padding: 9px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; color: var(--text); margin-bottom: 2px; }
        .note-item.active { background: rgba(137, 180, 250, 0.2); color: var(--accent); font-weight: bold; border-left: 3px solid var(--accent); }
        .note-title-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
        .mini-btn { background: transparent; border: none; color: var(--subtext); padding: 4px 6px; font-size: 13px; border-radius: 4px; cursor: pointer; }

        /* Модальные окна */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.78); z-index: 200; display: none; align-items: center; justify-content: center; padding: 16px; }
        .modal-overlay.open { display: flex; }
        .modal { background: var(--panel); border: 1px solid var(--surface-hover); border-radius: 12px; width: 100%; max-width: 420px; max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; }
        .modal-header { padding: 14px 16px; background: #14141f; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 15px; }
        .modal-body { padding: 14px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .form-label { font-size: 12px; color: var(--subtext); margin-bottom: 4px; display: block; }
        .form-input, .form-select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--surface-hover); background: var(--bg); color: var(--text); font-size: 14px; outline: none; }
        .filter-list { max-height: 230px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
        .filter-item { padding: 10px 12px; border-bottom: 1px solid #232334; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .filter-item-folder { font-size: 11px; color: var(--subtext); background: #252538; padding: 2px 6px; border-radius: 6px; }
        .create-new-option { padding: 11px 12px; background: rgba(166, 227, 161, 0.14); color: var(--success); font-weight: 600; cursor: pointer; font-size: 14px; border-bottom: 1px solid #232334; }

        footer { background: var(--panel); padding: 6px 12px; font-size: 12px; color: var(--subtext); display: flex; justify-content: space-between; border-top: 1px solid var(--border); flex-shrink: 0; }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <button class="icon-btn" onclick="toggleDrawer(true)">☰ Папки (<span id="total-notes-badge">0</span>)</button>
        <button class="icon-btn" id="backBtn" onclick="goBack()" style="display:none;">⬅</button>
        <div class="current-path" onclick="openNoteSettingsModal()">
            <span class="current-folder-label" id="header-folder">📁 Папка</span>
            <span class="current-tab-label" id="header-title">Название вкладки</span>
        </div>
    </div>
    <button class="icon-btn" onclick="openNoteSettingsModal()">⚙️</button>
</header>

<!-- Панель инструментов: рабочие кнопки слева, а 2 кнопки JSON — правее других -->
<div class="toolbar">
    <button onclick="openWikiLinkModal()">🔗 Вкладка в слово</button>
    <button onclick="openCreateNoteModal()">➕ Вкладка</button>
    <label class="file-btn">🖼️ Фото <input type="file" accept="image/*" onchange="insertImage(event)"></label>
    
    <div class="toolbar-spacer"></div>
    
    <button class="btn-blue" onclick="triggerJsonFilePicker()">📂 Выбрать свой JSON</button>
    <button class="btn-green" id="save-json-btn" onclick="writeDataToJsonFile()">💾 Записать в JSON</button>
    <input type="file" id="hidden-json-picker" accept=".json,.txt,application/json,*/*" onchange="handleJsonPicked(event)">
</div>

<div id="editor" contenteditable="true" oninput="triggerAutoSave()"></div>

<footer>
    <span id="status">Внутреннее автосохранение активно</span>
    <span id="word-count">Слов: 0</span>
</footer>

<!-- Боковое меню папок -->
<div class="drawer-overlay" id="drawer-overlay" onclick="toggleDrawer(false)"></div>
<aside class="drawer" id="drawer">
    <div class="drawer-header">
        <div class="drawer-top-row">
            <span class="drawer-title">📚 Папки и вкладки</span>
            <button class="mini-btn" onclick="toggleDrawer(false)" style="font-size:18px;color:var(--text);">✕</button>
        </div>
        <input type="text" id="drawer-search" class="search-input" placeholder="🔍 Фильтр по тысячам вкладок..." oninput="renderDrawerTree()">
        <div class="drawer-actions">
            <button class="primary" onclick="openCreateNoteModal()">+ Вкладка</button>
            <button onclick="createNewFolderPrompt()">+ 📁 Папка</button>
        </div>
    </div>
    <div class="tree-container" id="tree-container"></div>
</aside>

<!-- Модальное окно: Вкладка в слово с фильтром -->
<div class="modal-overlay" id="link-modal">
    <div class="modal">
        <div class="modal-header">
            <span>🔗 Вставить вкладку в слово</span>
            <button class="mini-btn" onclick="closeLinkModal()" style="font-size:18px;">✕</button>
        </div>
        <div class="modal-body">
            <div>
                <label class="form-label">Слово в тексте:</label>
                <input type="text" id="link-display-text" class="form-input" placeholder="Текст ссылки...">
            </div>
            <div>
                <label class="form-label">Папка (если создаётся новая):</label>
                <select id="link-target-folder" class="form-select"></select>
            </div>
            <div>
                <label class="form-label">Фильтр по вкладкам (или введите имя новой):</label>
                <input type="text" id="link-filter-input" class="form-input" placeholder="Поиск вкладки..." oninput="renderLinkFilterList()">
            </div>
            <div class="filter-list" id="link-filter-list"></div>
        </div>
    </div>
</div>

<!-- Модальное окно: Настройки вкладки -->
<div class="modal-overlay" id="note-modal">
    <div class="modal">
        <div class="modal-header">
            <span id="note-modal-title">Настройки вкладки</span>
            <button class="mini-btn" onclick="closeNoteModal()" style="font-size:18px;">✕</button>
        </div>
        <div class="modal-body">
            <div>
                <label class="form-label">Название вкладки:</label>
                <input type="text" id="note-name-input" class="form-input">
            </div>
            <div>
                <label class="form-label">Папка:</label>
                <div style="display:flex; gap:6px;">
                    <select id="note-folder-select" class="form-select" style="flex:1;"></select>
                    <button class="icon-btn" onclick="quickAddFolderInModal()">+ 📁</button>
                </div>
            </div>
            <div style="display:flex; gap:8px; margin-top:8px;">
                <button class="icon-btn" style="flex:1; justify-content:center; background:var(--accent); color:#11111b;" onclick="saveNoteModal()">Сохранить</button>
                <button class="icon-btn" id="delete-note-btn" style="background:var(--danger); color:#11111b;" onclick="deleteCurrentNote()">🗑️</button>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно физической записи файла на Android -->
<div class="modal-overlay" id="android-write-modal">
    <div class="modal">
        <div class="modal-header">
            <span>💾 Запись в файл <span id="modal-filename-title">book.json</span></span>
            <button class="mini-btn" onclick="closeWriteModal()" style="font-size:18px;">✕</button>
        </div>
        <div class="modal-body">
            <p id="write-modal-desc" style="font-size:13px; color:var(--subtext); line-height:1.45;">
                В Android приложениях без root-прав система требует подтвердить перезапись файла. Выберите рабочий метод для вашей оболочки:
            </p>
            <button class="icon-btn" style="justify-content:center; background:var(--success); color:#11111b; padding:12px;" onclick="executeShareFileWrite()">
                1. Перезаписать через Проводник (Рекомендуется)
            </button>
            <button class="icon-btn" style="justify-content:center; background:var(--accent); color:#11111b; padding:12px;" onclick="executeDirectDownloadWrite()">
                2. Выгрузить в папку Загрузки (Download)
            </button>
            <div>
                <label class="form-label">Или скопируйте готовый JSON-код файла напрямую:</label>
                <textarea id="raw-json-Preview" class="form-input" style="height:85px; font-family:monospace; font-size:11px;" readonly onclick="this.select()"></textarea>
                <button class="icon-btn" style="width:100%; justify-content:center; margin-top:6px;" onclick="copyRawJson()">
                    📋 Скопировать JSON в буфер
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    function getDefaultTemplate() {
        return {
            folders: ["Главы", "Персонажи", "Лор и Мир", "Черновики"],
            expandedFolders: {"Главы": true, "Персонажи": true, "Лор и Мир": true},
            notes: {
                "Глава 1. Начало": {
                    folder: "Главы",
                    content: "Это стартовый шаблон вашей книги. Нажмите на имя <span class='wiki-link' contenteditable='false' data-target='Артур'>Артур</span> для перехода.<br><br>Все изменения мгновенно сохраняются внутри приложения, а кнопками справа вверху выгружаются в ваш физический JSON-файл.",
                    updated: Date.now()
                },
                "Артур": {
                    folder: "Персонажи",
                    content: "<b>Артур</b> — главный герой. Нажмите «⬅» вверху для возврата.",
                    updated: Date.now()
                }
            },
            currentNote: "Глава 1. Начало"
        };
    }

    let appState = getDefaultTemplate();
    let historyStack = [];
    let idb = null;
    let saveTimer = null;
    let savedSelectionRange = null;
    let noteModalMode = "create";
    let currentJsonFileName = localStorage.getItem('writer_json_filename_v4') || "my_book.json";

    const editor = document.getElementById('editor');
    const statusText = document.getElementById('status');
    const backBtn = document.getElementById('backBtn');

    // ---------------- 1. ВНУТРЕННЕЕ АВТОСОХРАНЕНИЕ (КАЖДЫЕ 0.3 СЕК) ----------------
    try {
        const localBackup = localStorage.getItem('writer_studio_state_v4');
        if (localBackup) appState = migrateDataIfNeeded(JSON.parse(localBackup));
    } catch (e) {}

    const request = indexedDB.open("WriterStudioOfflineDB_v4", 1);
    request.onupgradeneeded = (e) => e.target.result.createObjectStore("bookStore");
    request.onsuccess = (e) => {
        idb = e.target.result;
        const tx = idb.transaction("bookStore", "readonly");
        const getReq = tx.objectStore("bookStore").get("studioState");
        getReq.onsuccess = () => {
            if (getReq.result) appState = migrateDataIfNeeded(getReq.result);
            if (!appState.notes[appState.currentNote]) appState.currentNote = Object.keys(appState.notes)[0];
            openNote(appState.currentNote, false);
            updateFileButtonsUI();
        };
    };

    setTimeout(() => {
        if (!editor.innerHTML && appState.notes[appState.currentNote]) {
            openNote(appState.currentNote, false);
            updateFileButtonsUI();
        }
    }, 250);

    function migrateDataIfNeeded(data) {
        if (!data || typeof data !== 'object' || Object.keys(data).length === 0) return getDefaultTemplate();
        if (data.notes && data.folders && Object.keys(data.notes).length > 0) return data;
        const migrated = getDefaultTemplate();
        migrated.notes = {};
        Object.keys(data).forEach(title => {
            migrated.notes[title] = {
                folder: "Главы",
                content: typeof data[title] === 'string' ? data[title] : (data[title].content || ""),
                updated: Date.now()
            };
        });
        migrated.currentNote = Object.keys(migrated.notes)[0] || "Глава 1. Начало";
        return migrated;
    }

    function persistInternalState() {
        const jsonString = JSON.stringify(appState, null, 2);
        try { localStorage.setItem('writer_studio_state_v4', jsonString); } catch (e) {}
        if (idb) {
            try {
                const tx = idb.transaction("bookStore", "readwrite");
                tx.objectStore("bookStore").put(appState, "studioState");
            } catch (e) {}
        }
        // Если приложение собрано через Website 2 APK Builder с поддержкой Java-моста
        if (window.Android && typeof window.Android.writeToFile === 'function') {
            try {
                window.Android.writeToFile(currentJsonFileName, jsonString);
                statusText.innerText = "💾 Автозаписано в файл: " + currentJsonFileName;
                return;
            } catch (e) {}
        }
        statusText.innerText = "Автосохранено внутри приложения (" + new Date().toLocaleTimeString() + ")";
    }

    function triggerAutoSave() {
        if (!appState.notes[appState.currentNote]) return;
        appState.notes[appState.currentNote].content = editor.innerHTML;
        appState.notes[appState.currentNote].updated = Date.now();
        updateWordCount();
        statusText.innerText = "Сохранение...";
        clearTimeout(saveTimer);
        saveTimer = setTimeout(persistInternalState, 300);
    }

    function updateFileButtonsUI() {
        document.getElementById('save-json-btn').innerText = "💾 Записать в " + currentJsonFileName;
        document.getElementById('modal-filename-title').innerText = currentJsonFileName;
    }

    // ---------------- 2. ЧТЕНИЕ И ЗАПИСЬ ФИЗИЧЕСКОГО JSON ФАЙЛА ----------------
    function triggerJsonFilePicker() {
        document.getElementById('hidden-json-picker').click();
    }

    function handleJsonPicked(event) {
        const file = event.target.files[0];
        if (!file) return;

        currentJsonFileName = file.name.endsWith('.json') ? file.name : (file.name + ".json");
        localStorage.setItem('writer_json_filename_v4', currentJsonFileName);
        updateFileButtonsUI();

        const reader = new FileReader();
        reader.onload = (e) => {
            const rawText = (e.target.result || "").trim();
            let isEmpty = false;

            if (!rawText || rawText === "{}" || rawText === "[]") {
                isEmpty = true;
            } else {
                try {
                    const parsed = JSON.parse(rawText);
                    if (!parsed || Object.keys(parsed).length === 0) {
                        isEmpty = true;
                    } else {
                        appState = migrateDataIfNeeded(parsed);
                    }
                } catch (err) {
                    isEmpty = true;
                }
            }

            if (isEmpty) {
                // Заливаем шаблон (или текущие наработки) и сразу открываем окно реальной записи в этот файл!
                if (Object.keys(appState.notes).length <= 2) {
                    appState = getDefaultTemplate();
                }
                appState.currentNote = Object.keys(appState.notes)[0];
                openNote(appState.currentNote, false);
                persistInternalState();

                document.getElementById('write-modal-desc').innerHTML = 
                    `<b style="color:var(--success);">Пустой файл «${currentJsonFileName}» прочитан и заполнен шаблоном в памяти!</b><br>` +
                    `Так как Android открывает файлы в режиме «Только чтение», нажмите кнопку ниже, чтобы физически сохранить шаблон поверх вашего файла на диске:`;
                writeDataToJsonFile();
            } else {
                appState.currentNote = Object.keys(appState.notes)[0];
                historyStack = [];
                openNote(appState.currentNote, false);
                persistInternalState();
                alert(`Книга из файла «${currentJsonFileName}» (${Object.keys(appState.notes).length} вкладок) успешно загружена!`);
            }
        };
        reader.readAsText(file);
        event.target.value = "";
    }

    // Вызов реального сохранения в JSON на устройстве
    async function writeDataToJsonFile() {
        if (appState.notes[appState.currentNote]) {
            appState.notes[appState.currentNote].content = editor.innerHTML;
        }
        persistInternalState();
        const jsonString = JSON.stringify(appState, null, 2);

        // Заполняем текстовое поле предпросмотра (чтобы пользователь видел, что JSON реально сформирован)
        document.getElementById('raw-json-Preview').value = jsonString;

        // Открываем окно выбора способа физической записи на Android
        document.getElementById('android-write-modal').classList.add('open');
    }

    function closeWriteModal() {
        document.getElementById('android-write-modal').classList.remove('open');
    }

    // Способ 1: Системное меню Android Share (позволяет выбрать любой файловый менеджер, например "Файлы" или "Cx Проводник", и перезаписать файл в любой папке)
    async function executeShareFileWrite() {
        const jsonString = JSON.stringify(appState, null, 2);
        try {
            const file = new File([jsonString], currentJsonFileName, { type: "application/json" });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({
                    title: currentJsonFileName,
                    files: [file]
                });
                closeWriteModal();
                statusText.innerText = "✅ Выгружено через системное меню Android";
                return;
            }
        } catch (err) {
            if (err.name === 'AbortError') return;
        }
        // Если WebView внутри APK не поддерживает navigator.share, переключаемся на скачивание
        executeDirectDownloadWrite();
    }

    // Способ 2: Прямая отдача файла в менеджер загрузок Android / Chrome
    function executeDirectDownloadWrite() {
        const jsonString = JSON.stringify(appState, null, 2);
        try {
            const blob = new Blob([jsonString], { type: "application/octet-stream" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = currentJsonFileName;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 1500);
            closeWriteModal();
            statusText.innerText = "📥 Файл «" + currentJsonFileName + "» отправлен в папку Download";
        } catch (e) {
            alert("Ваш APK-конвертер заблокировал скачивание файлов. Нажмите «Скопировать JSON в буфер» ниже.");
        }
    }

    // Способ 3: Безотказное копирование JSON-текста (работает даже в самых заблокированных APK)
    function copyRawJson() {
        const ta = document.getElementById('raw-json-Preview');
        ta.select();
        ta.setSelectionRange(0, 999999);
        try {
            navigator.clipboard.writeText(ta.value);
        } catch (e) {
            document.execCommand('copy');
        }
        alert("Весь JSON-код скопирован! Вставьте его в ваш файл в любом текстовом редакторе.");
        closeWriteModal();
    }

    // ---------------- 3. РАБОТА С ПАПКАМ И ВКЛАДКАМИ ----------------
    function openNote(noteTitle, pushHistory = true) {
        if (pushHistory && noteTitle !== appState.currentNote) {
            historyStack.push(appState.currentNote);
        }
        if (!appState.notes[noteTitle]) {
            appState.notes[noteTitle] = {
                folder: appState.folders[0] || "Главы",
                content: `<b>${noteTitle}</b><br><br>`,
                updated: Date.now()
            };
        }
        appState.currentNote = noteTitle;
        const noteObj = appState.notes[noteTitle];

        editor.innerHTML = noteObj.content;
        document.getElementById('header-folder').innerText = "📁 " + (noteObj.folder || "Без папки");
        document.getElementById('header-title').innerText = noteTitle;
        document.getElementById('total-notes-badge').innerText = Object.keys(appState.notes).length;
        backBtn.style.display = historyStack.length > 0 ? 'inline-flex' : 'none';

        updateWordCount();
        persistInternalState();
    }

    function goBack() {
        while (historyStack.length > 0) {
            const prev = historyStack.pop();
            if (appState.notes[prev]) {
                openNote(prev, false);
                return;
            }
        }
        backBtn.style.display = 'none';
    }

    function toggleDrawer(open) {
        const overlay = document.getElementById('drawer-overlay');
        const drawer = document.getElementById('drawer');
        if (open) {
            renderDrawerTree();
            overlay.classList.add('open');
            drawer.classList.add('open');
        } else {
            overlay.classList.remove('open');
            drawer.classList.remove('open');
        }
    }

    function renderDrawerTree() {
        const container = document.getElementById('tree-container');
        const query = document.getElementById('drawer-search').value.trim().toLowerCase();
        container.innerHTML = '';

        const allNoteNames = Object.keys(appState.notes).sort((a, b) => a.localeCompare(b, 'ru'));
        document.getElementById('total-notes-badge').innerText = allNoteNames.length;

        allNoteNames.forEach(name => {
            const f = appState.notes[name].folder || "Без папки";
            if (!appState.folders.includes(f)) appState.folders.push(f);
        });

        appState.folders.forEach(folderName => {
            const notesInFolder = allNoteNames.filter(n => {
                const matchFolder = (appState.notes[n].folder || "Без папки") === folderName;
                if (!matchFolder) return false;
                if (!query) return true;
                return n.toLowerCase().includes(query) || folderName.toLowerCase().includes(query);
            });

            if (query && notesInFolder.length === 0) return;

            const block = document.createElement('div');
            const isExpanded = query ? true : !!appState.expandedFolders[folderName];
            block.className = 'folder-block' + (isExpanded ? ' expanded' : '');

            const header = document.createElement('div');
            header.className = 'folder-header';
            header.onclick = () => {
                appState.expandedFolders[folderName] = !appState.expandedFolders[folderName];
                renderDrawerTree();
            };

            const arrow = isExpanded ? '▾' : '▸';
            header.innerHTML = `
                <div class="folder-header-left">
                    <span>${arrow} 📁 ${folderName}</span>
                    <span class="folder-count">${notesInFolder.length}</span>
                </div>
                <div onclick="event.stopPropagation()">
                    <button class="mini-btn" onclick="openCreateNoteModal('${folderName.replace(/'/g, "\\'")}')">＋</button>
                    <button class="mini-btn" onclick="renameFolderPrompt('${folderName.replace(/'/g, "\\'")}')">✎</button>
                </div>
            `;

            const itemsContainer = document.createElement('div');
            itemsContainer.className = 'folder-items';

            notesInFolder.slice(0, 300).forEach(noteName => {
                const item = document.createElement('div');
                item.className = 'note-item' + (noteName === appState.currentNote ? ' active' : '');
                item.onclick = () => {
                    openNote(noteName, true);
                    toggleDrawer(false);
                };
                item.innerHTML = `<span class="note-title-text">📄 ${noteName}</span>`;
                itemsContainer.appendChild(item);
            });

            block.appendChild(header);
            block.appendChild(itemsContainer);
            container.appendChild(block);
        });
    }

    function createNewFolderPrompt() {
        const name = prompt("Название новой папки:");
        if (name && name.trim()) {
            const clean = name.trim();
            if (!appState.folders.includes(clean)) {
                appState.folders.push(clean);
                appState.expandedFolders[clean] = true;
                persistInternalState();
                renderDrawerTree();
            }
        }
    }

    function renameFolderPrompt(oldName) {
        const newName = prompt(`Новое название для папки «${oldName}»:`, oldName);
        if (!newName || !newName.trim() || newName.trim() === oldName) return;
        const clean = newName.trim();
        const idx = appState.folders.indexOf(oldName);
        if (idx !== -1) appState.folders[idx] = clean;
        Object.keys(appState.notes).forEach(n => {
            if (appState.notes[n].folder === oldName) appState.notes[n].folder = clean;
        });
        appState.expandedFolders[clean] = true;
        openNote(appState.currentNote, false);
        renderDrawerTree();
    }

    // ---------------- 4. ВКЛАДКА В СЛОВО С ФИЛЬТРОМ ----------------
    function saveCurrentSelection() {
        const sel = window.getSelection();
        if (sel.rangeCount > 0 && editor.contains(sel.anchorNode)) {
            savedSelectionRange = sel.getRangeAt(0).cloneRange();
            return sel.toString().trim();
        }
        savedSelectionRange = null;
        return "";
    }

    function restoreSelection() {
        editor.focus();
        if (savedSelectionRange) {
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(savedSelectionRange);
        }
    }

    function populateFolderSelect(selectElem, defaultFolder) {
        selectElem.innerHTML = '';
        appState.folders.forEach(f => {
            const opt = document.createElement('option');
            opt.value = f;
            opt.innerText = "📁 " + f;
            if (f === defaultFolder) opt.selected = true;
            selectElem.appendChild(opt);
        });
    }

    function openWikiLinkModal() {
        const selectedWord = saveCurrentSelection();
        document.getElementById('link-display-text').value = selectedWord;
        document.getElementById('link-filter-input').value = selectedWord;

        const currentFolder = appState.notes[appState.currentNote]?.folder || appState.folders[0];
        populateFolderSelect(document.getElementById('link-target-folder'), currentFolder);

        renderLinkFilterList();
        document.getElementById('link-modal').classList.add('open');
        setTimeout(() => document.getElementById('link-filter-input').focus(), 60);
    }

    function closeLinkModal() {
        document.getElementById('link-modal').classList.remove('open');
    }

    function renderLinkFilterList() {
        const query = document.getElementById('link-filter-input').value.trim();
        const queryLower = query.toLowerCase();
        const listContainer = document.getElementById('link-filter-list');
        listContainer.innerHTML = '';

        const allNotes = Object.keys(appState.notes);
        const matched = allNotes.filter(title => {
            if (!queryLower) return true;
            const folder = (appState.notes[title].folder || "").toLowerCase();
            return title.toLowerCase().includes(queryLower) || folder.includes(queryLower);
        }).sort((a, b) => a.localeCompare(b, 'ru'));

        if (query && !appState.notes[query]) {
            const createRow = document.createElement('div');
            createRow.className = 'create-new-option';
            createRow.innerText = `➕ Создать новую вкладку «${query}»`;
            createRow.onclick = () => confirmInsertWikiLink(query, true);
            listContainer.appendChild(createRow);
        }

        matched.slice(0, 100).forEach(noteTitle => {
            const row = document.createElement('div');
            row.className = 'filter-item';
            const folderName = appState.notes[noteTitle].folder || "Без папки";
            row.innerHTML = `<span>📄 ${noteTitle}</span><span class="filter-item-folder">📁 ${folderName}</span>`;
            row.onclick = () => confirmInsertWikiLink(noteTitle, false);
            listContainer.appendChild(row);
        });
    }

    function confirmInsertWikiLink(targetTabName, isNew) {
        const displayInput = document.getElementById('link-display-text').value.trim();
        const selectedFolder = document.getElementById('link-target-folder').value || appState.folders[0];
        const finalDisplayWord = displayInput || targetTabName;

        if (isNew || !appState.notes[targetTabName]) {
            appState.notes[targetTabName] = {
                folder: selectedFolder,
                content: `<b>${targetTabName}</b> (папка: ${selectedFolder})<br><br>`,
                updated: Date.now()
            };
            appState.expandedFolders[selectedFolder] = true;
        }

        closeLinkModal();
        restoreSelection();

        const safeTarget = targetTabName.replace(/"/g, '&quot;');
        const linkHTML = `<span class="wiki-link" contenteditable="false" data-target="${safeTarget}">${finalDisplayWord}</span>&nbsp;`;
        document.execCommand('insertHTML', false, linkHTML);
        document.getElementById('total-notes-badge').innerText = Object.keys(appState.notes).length;
        triggerAutoSave();
    }

    editor.addEventListener('click', (e) => {
        const link = e.target.closest('.wiki-link');
        if (link) {
            const target = link.getAttribute('data-target');
            if (target) openNote(target, true);
        }
    });

    // ---------------- 5. НАСТРОЙКИ ВКЛАДКИ И ФОТО ----------------
    function openCreateNoteModal(preselectedFolder) {
        noteModalMode = "create";
        document.getElementById('note-modal-title').innerText = "➕ Новая вкладка";
        document.getElementById('note-name-input').value = "";
        document.getElementById('delete-note-btn').style.display = "none";
        const folder = preselectedFolder || appState.notes[appState.currentNote]?.folder || appState.folders[0];
        populateFolderSelect(document.getElementById('note-folder-select'), folder);
        document.getElementById('note-modal').classList.add('open');
    }

    function openNoteSettingsModal() {
        noteModalMode = "edit";
        document.getElementById('note-modal-title').innerText = "⚙️ Настройки вкладки";
        document.getElementById('note-name-input').value = appState.currentNote;
        document.getElementById('delete-note-btn').style.display = Object.keys(appState.notes).length > 1 ? "inline-flex" : "none";
        const folder = appState.notes[appState.currentNote]?.folder || appState.folders[0];
        populateFolderSelect(document.getElementById('note-folder-select'), folder);
        document.getElementById('note-modal').classList.add('open');
    }

    function closeNoteModal() {
        document.getElementById('note-modal').classList.remove('open');
    }

    function quickAddFolderInModal() {
        const name = prompt("Название новой папки:");
        if (name && name.trim()) {
            const clean = name.trim();
            if (!appState.folders.includes(clean)) appState.folders.push(clean);
            populateFolderSelect(document.getElementById('note-folder-select'), clean);
        }
    }

    function saveNoteModal() {
        const newName = document.getElementById('note-name-input').value.trim();
        const folder = document.getElementById('note-folder-select').value;
        if (!newName) return;

        if (noteModalMode === "create") {
            if (!appState.notes[newName]) {
                appState.notes[newName] = { folder: folder, content: "", updated: Date.now() };
            }
            appState.expandedFolders[folder] = true;
            closeNoteModal();
            openNote(newName, true);
            toggleDrawer(false);
        } else {
            const oldName = appState.currentNote;
            appState.notes[oldName].folder = folder;
            if (newName !== oldName) {
                appState.notes[newName] = appState.notes[oldName];
                delete appState.notes[oldName];
                Object.keys(appState.notes).forEach(k => {
                    appState.notes[k].content = appState.notes[k].content.replaceAll(`data-target="${oldName}"`, `data-target="${newName}"`);
                });
                appState.currentNote = newName;
            }
            closeNoteModal();
            openNote(appState.currentNote, false);
        }
    }

    function deleteCurrentNote() {
        if (Object.keys(appState.notes).length <= 1) return;
        if (confirm(`Удалить вкладку «${appState.currentNote}»?`)) {
            delete appState.notes[appState.currentNote];
            closeNoteModal();
            openNote(Object.keys(appState.notes)[0], false);
        }
    }

    function insertImage(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const maxW = 850;
                const scale = maxW / img.width < 1 ? maxW / img.width : 1;
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                editor.focus();
                document.execCommand('insertHTML', false, `<br><img src="${dataUrl}"><br>`);
                triggerAutoSave();
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
        event.target.value = "";
    }

    function updateWordCount() {
        const text = editor.innerText.trim();
        const words = text ? text.split(/\s+/).length : 0;
        document.getElementById('word-count').innerText = `Слов: ${words}`;
    }
</script>
</body>
